[package]
name = "mic-recorder"
version = "0.1.0"
edition = "2021"
description = "Continuous USB microphone recorder with timestamped chunks and Cloudflare R2 upload"

[dependencies]
cpal = "0.15"
hound = "3.5"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.50"
aws-credential-types = "1.2"
aws-smithy-types = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
