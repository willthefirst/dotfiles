# tools/vscode/tool.conf
# VS Code configuration using JSON deep-merge for settings/keybindings, symlinks for snippets

# Layer sources
layers_base="local:configs/vscode"
layers_stripe="STRIPE_DOTFILES:vscode"

# Target location
# macOS: ~/Library/Application Support/Code/User
# Linux: ${XDG_CONFIG_HOME:-$HOME/.config}/Code/User
target="${HOME}/Library/Application Support/Code/User"

# Install hook - installs extensions
install_hook="./install.sh"

# Merge hook - merges JSON configs and symlinks snippets
merge_hook="./merge.sh"
